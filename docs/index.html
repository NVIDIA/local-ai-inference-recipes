 profile \\\n  --model {{API_MODEL}} \\\n  --endpoint-type chat \\\n  --streaming \\\n  --use-server-token-count \\\n  --url {{API_BASE}} \\\n  --custom-dataset-type {{DATASET_TYPE}} \\\n  --input-file \"$SPEED_BENCH_DIR/{{PROFILE}}.jsonl\" \\\n  --server-metrics {{API_BASE_METRICS}} \\\n  --concurrency 1 \\\n  --osl {{OUTPUT_TOKENS}} \\\n  --request-count {{REQUESTS}} \\\n{{#if WARMUP}}\n  --warmup-request-count {{WARMUP_REQUESTS}} \\\n{{/if}}\n  --output-artifact-dir ./artifacts/{{DATASET_TYPE}}\n\ntest -f ./artifacts/{{DATASET_TYPE}}/profile_export_aiperf.json\n\n\"$AIPERF_VENV/bin/python3\" - \u003c\u003cPY\nimport json\nfrom pathlib import Path\n\nresults = json.loads(Path('artifacts/{{DATASET_TYPE}}/profile_export_aiperf.json').read_text())\nfor label, metric in [\n    ('Prefill throughput (tok/s)', 'active_prefill_throughput'),\n    ('Decode throughput (tok/s)', 'active_decode_throughput'),\n    ('E2E latency (ms)', 'request_latency'),\n]:\n    value = results.get(metric)\n    if not value or value.get('avg') is None:\n        raise SystemExit(f'missing {metric} in profile_export_aiperf.json')\n    avg = value['avg']\n    unit = value.get('unit', '')\n    print(f'{label}: {avg:.2f} {unit}'.strip())\nPY\n","schema-1/linux/aiperf.setup":"AIPERF_VENV=\"$HOME/aiperf-venv\"\n# aiperf builds the crick wheel from source on aarch64 and needs Python headers:\nsudo apt-get install -y python3-dev\npython3 -m venv \"$AIPERF_VENV\"\n\"$AIPERF_VENV/bin/pip\" install --upgrade pip\n\"$AIPERF_VENV/bin/pip\" install aiperf\nsource \"$AIPERF_VENV/bin/activate\"\n\n# SPEED-Bench draws one source from the gated cais/hle dataset:\n#   https://huggingface.co/datasets/cais/hle\n# 1. Create a read Hugging Face access token:\n#    https://huggingface.co/settings/tokens\n# 2. Accept the cais/hle terms — open the dataset page and click\n#    \"Agree and access repository\", or request access from the command\n#    line with your token:\n#      python -c \"from huggingface_hub import request_access; request_access(repo_id='cais/hle', repo_type='dataset', token='\u003ctoken>')\"\n# 3. Export the token so the prepare script can authenticate:\nexport HF_TOKEN=\u003cyour-hf-access-token>\n\nSPEED_BENCH_DIR=\"$HOME/{{SPEED_BENCH_DIR}}\"\nmkdir -p \"$SPEED_BENCH_DIR\"\ncurl -LsSf https://raw.githubusercontent.com/NVIDIA-NeMo/Skills/refs/heads/main/nemo_skills/dataset/speed-bench/prepare.py \\\n  -o \"$SPEED_BENCH_DIR/prepare.py\"\npython3 \"$SPEED_BENCH_DIR/prepare.py\" --config {{PROFILE}} --output_dir \"$SPEED_BENCH_DIR\"\n","schema-1/windows/speed-bench.run":"$speedBenchRoot = Join-Path $HOME {{ROOT_NAME}}\n$speedBenchPython = Join-Path $speedBenchRoot '.venv\\Scripts\\python.exe'\n$speedBenchOutput = Join-Path (Get-Location) {{OUTPUT_NAME}}\n{{#if DISCOVER_MODEL}}\n$speedBenchApi = {{API_BASE}}\n$speedBenchModels = @((Invoke-RestMethod -Uri ($speedBenchApi + '/models')).data)\nif ($speedBenchModels.Count -ne 1 -or -not $speedBenchModels[0].id) { throw 'Expected exactly one served model; check the recipe server.' }\n$speedBenchModel = [string]$speedBenchModels[0].id\n{{/if}}\n& $speedBenchPython (Join-Path $speedBenchRoot 'speed_bench.py') `\n  --url {{API_BASE}} `\n  --model {{API_MODEL}} `\n  --bench {{PROFILE}} `\n  --category {{CATEGORY}} `\n  --osl {{OUTPUT_TOKENS}} `\n  --concurrency {{CONCURRENCY}} `\n{{#if INCLUDE_LIMIT}}\n  --limit {{LIMIT}} `\n{{/if}}\n  --timeout {{TIMEOUT}} `\n{{#if INCLUDE_EXTRA_INPUTS}}\n  --extra-inputs {{EXTRA_INPUTS}} `\n{{/if}}\n  --output $speedBenchOutput\n\nif ($LASTEXITCODE -ne 0) { throw 'SPEED-Bench failed with exit code ' + $LASTEXITCODE + '.' }\nif (-not (Test-Path -LiteralPath $speedBenchOutput)) { throw 'SPEED-Bench did not create the expected results file.' }\n$speedBenchResult = Get-Content -Raw -LiteralPath $speedBenchOutput | ConvertFrom-Json -ErrorAction Stop\nif ([int]$speedBenchResult.selected_samples -ne {{EXPECTED_SAMPLES}} -or [int]$speedBenchResult.completed_samples -ne {{EXPECTED_SAMPLES}} -or [int]$speedBenchResult.failed_samples -ne 0) { throw 'Expected {{EXPECTED_SAMPLES}} successful {{SAMPLE_UNIT}} and 0 failures; refusing to display partial metrics.' }\n$overallRows = @($speedBenchResult.summary | Where-Object { $_.category -eq 'overall' })\nif ($overallRows.Count -ne 1) { throw 'SPEED-Bench results do not contain exactly one overall summary.' }\n$overall = $overallRows[0]\nif ($null -eq $overall.avg_prompt_t_s -or $null -eq $overall.avg_pred_t_s) { throw 'SPEED-Bench overall summary is missing throughput metrics.' }\n{{#if INCLUDE_E2E}}\nif ($null -eq $overall.avg_latency) { throw 'SPEED-Bench overall summary is missing latency.' }\n{{/if}}\n[pscustomobject]@{\n  'Prefill throughput (tok/s)' = [Math]::Round([double]$overall.avg_prompt_t_s, 2)\n  'Decode throughput (tok/s)' = [Math]::Round([double]$overall.avg_pred_t_s, 2)\n{{#if INCLUDE_E2E}}\n  'E2E latency (ms)' = [Math]::Round(([double]$overall.avg_latency * 1000), 2)\n{{/if}}\n}\n","schema-1/windows/speed-bench.setup":"$speedBenchRoot = Join-Path $HOME {{ROOT_NAME}}\n$null = New-Item -ItemType Directory -Force -Path $speedBenchRoot\nInvoke-WebRequest -Uri {{SPEED_BENCH_PY_URL}} -OutFile (Join-Path $speedBenchRoot 'speed_bench.py')\nInvoke-WebRequest -Uri {{REQUIREMENTS_URL}} -OutFile (Join-Path $speedBenchRoot 'requirements.txt')\npython -m venv (Join-Path $speedBenchRoot '.venv')\n$speedBenchPython = Join-Path $speedBenchRoot '.venv\\Scripts\\python.exe'\n& $speedBenchPython -m pip install -r (Join-Path $speedBenchRoot 'requirements.txt')\n","schema-2/linux/agentperf-local.run":"AGENTPERF_ROOT=\"$HOME/agentperf-local\"\nexport AGENTPERF_OUTPUT=\"$(pwd)/agentperf-results\"\n{{#if DISCOVER_MODEL}}\nAGENTPERF_MODEL=\"$(uv run --project \"$AGENTPERF_ROOT\" python - {{API_BASE}} \u003c\u003c'PY'\nimport json, sys, urllib.request\nwith urllib.request.urlopen(sys.argv[1] + '/models', timeout=30) as response:\n    models = json.load(response)['data']\nif len(models) != 1 or not models[0].get('id'):\n    raise SystemExit('Expected exactly one served model; check the recipe server.')\nprint(models[0]['id'])\nPY\n)\" || exit $?\n{{/if}}\nuv run --project \"$AGENTPERF_ROOT\" agentperf-local run --base-url {{API_BASE}} --model {{API_MODEL}} --tool-choice none --output-dir \"$AGENTPERF_OUTPUT\" || exit $?\n\npython3 - \u003c\u003cPY\nimport json, os\nsummary = json.load(open(f\"{os.environ['AGENTPERF_OUTPUT']}/summary.json\"))\nprint(f\"Completion time (s): {summary['measured_duration_ms'] / 1000:.2f}\")\nPY\n","schema-2/linux/agentperf-local.setup":"(\n  # Subshell: \"exit 1\" below stops only this setup, not the interactive\n  # terminal it's pasted into.\n  AGENTPERF_ROOT=\"$HOME/agentperf-local\"\n  if [ -d \"$AGENTPERF_ROOT/.git\" ]; then\n    git -C \"$AGENTPERF_ROOT\" fetch --tags || exit 1\n  else\n    git clone https://github.com/ArtificialAnalysis/aa-agentperf-local.git \"$AGENTPERF_ROOT\" || exit 1\n  fi\n  # Stop here on failure -- otherwise uv sync below would silently run\n  # against whatever revision was already checked out, not the pinned one.\n  git -C \"$AGENTPERF_ROOT\" checkout {{REF}} || exit 1\n  uv sync --project \"$AGENTPERF_ROOT\" || exit 1\n)\n","schema-2/linux/aiperf.run":"AIPERF_VENV=\"$HOME/aiperf-venv\"\nSPEED_BENCH_DIR=\"$HOME/{{SPEED_BENCH_DIR}}\"\n\"$AIPERF_VENV/bin/aiperf\" profile \\\n  --model {{API_MODEL}} \\\n  --endpoint-type chat \\\n  --streaming \\\n  --use-server-token-count \\\n  --url {{API_BASE}} \\\n  --custom-dataset-type {{DATASET_TYPE}} \\\n  --input-file \"$SPEED_BENCH_DIR/{{PROFILE}}.jsonl\" \\\n  --server-metrics {{API_BASE_METRICS}} \\\n  --concurrency 1 \\\n  --osl {{OUTPUT_TOKENS}} \\\n  --request-count {{REQUESTS}} \\\n{{#if WARMUP}}\n  --warmup-request-count {{WARMUP_REQUESTS}} \\\n{{/if}}\n  --output-artifact-dir ./artifacts/{{DATASET_TYPE}}\n\ntest -f ./artifacts/{{DATASET_TYPE}}/profile_export_aiperf.json\n\n\"$AIPERF_VENV/bin/python3\" - \u003c\u003cPY\nimport json\nfrom pathlib import Path\n\nresults = json.loads(Path('artifacts/{{DATASET_TYPE}}/profile_export_aiperf.json').read_text())\nfor label, metric in [\n    ('Prefill throughput (tok/s)', 'active_prefill_throughput'),\n    ('Decode throughput (tok/s)', 'active_decode_throughput'),\n    ('E2E latency (ms)', 'request_latency'),\n]:\n    value = results.get(metric)\n    if not value or value.get('avg') is None:\n        raise SystemExit(f'missing {metric} in profile_export_aiperf.json')\n    avg = value['avg']\n    unit = value.get('unit', '')\n    print(f'{label}: {avg:.2f} {unit}'.strip())\nPY\n","schema-2/linux/aiperf.setup":"AIPERF_VENV=\"$HOME/aiperf-venv\"\n# aiperf builds the crick wheel from source on aarch64 and needs Python headers:\nsudo apt-get install -y python3-dev\npython3 -m venv \"$AIPERF_VENV\"\n\"$AIPERF_VENV/bin/pip\" install --upgrade pip\n\"$AIPERF_VENV/bin/pip\" install aiperf\nsource \"$AIPERF_VENV/bin/activate\"\n\n# SPEED-Bench draws one source from the gated cais/hle dataset:\n#   https://huggingface.co/datasets/cais/hle\n# 1. Create a read Hugging Face access token:\n#    https://huggingface.co/settings/tokens\n# 2. Accept the cais/hle terms — open the dataset page and click\n#    \"Agree and access repository\", or request access from the command\n#    line with your token:\n#      python -c \"from huggingface_hub import request_access; request_access(repo_id='cais/hle', repo_type='dataset', token='\u003ctoken>')\"\n# 3. Export the token so the prepare script can authenticate:\nexport HF_TOKEN=\u003cyour-hf-access-token>\n\nSPEED_BENCH_DIR=\"$HOME/{{SPEED_BENCH_DIR}}\"\nmkdir -p \"$SPEED_BENCH_DIR\"\ncurl -LsSf https://raw.githubusercontent.com/NVIDIA-NeMo/Skills/refs/heads/main/nemo_skills/dataset/speed-bench/prepare.py \\\n  -o \"$SPEED_BENCH_DIR/prepare.py\"\npython3 \"$SPEED_BENCH_DIR/prepare.py\" --config {{PROFILE}} --output_dir \"$SPEED_BENCH_DIR\"\n","schema-2/windows/agentperf-local.run":"$agentPerfRoot = Join-Path $HOME 'agentperf-local'\n$env:UV_PROJECT_ENVIRONMENT = Join-Path $agentPerfRoot 'venv-windows'\n$agentPerfOutput = Join-Path (Get-Location) 'agentperf-results'\n{{#if DISCOVER_MODEL}}\n$agentPerfModels = (Invoke-RestMethod -Uri ({{API_BASE}} + '/models')).data\nif ($agentPerfModels.Count -ne 1 -or -not $agentPerfModels[0].id) { throw 'Expected exactly one served model; check the recipe server.' }\n$agentPerfModel = $agentPerfModels[0].id\n{{/if}}\nuv run --project $agentPerfRoot agentperf-local run --base-url {{API_BASE}} --model {{API_MODEL}} --tool-choice none --output-dir $agentPerfOutput\nif ($LASTEXITCODE -ne 0) { throw 'agentperf-local failed with exit code ' + $LASTEXITCODE + '.' }\n$summary = Get-Content -Raw -LiteralPath (Join-Path $agentPerfOutput 'summary.json') | ConvertFrom-Json\n[pscustomobject]@{ 'Completion time (s)' = [Math]::Round([double]$summary.measured_duration_ms / 1000, 2) }\n","schema-2/windows/agentperf-local.setup":"$agentPerfRoot = Join-Path $HOME 'agentperf-local'\nif (Test-Path -LiteralPath (Join-Path $agentPerfRoot '.git')) {\n  git -C $agentPerfRoot fetch --tags\n  if ($LASTEXITCODE -ne 0) { throw 'git fetch failed with exit code ' + $LASTEXITCODE + '.' }\n} else {\n  git clone https://github.com/ArtificialAnalysis/aa-agentperf-local.git $agentPerfRoot\n  if ($LASTEXITCODE -ne 0) { throw 'git clone failed with exit code ' + $LASTEXITCODE + '.' }\n}\ngit -C $agentPerfRoot checkout {{REF}}\nif ($LASTEXITCODE -ne 0) { throw 'git checkout failed with exit code ' + $LASTEXITCODE + '; refusing to sync against a stale revision.' }\n# A dedicated environment folder, kept apart from any other shell's virtual\n# environment in the same clone.\n$env:UV_PROJECT_ENVIRONMENT = Join-Path $agentPerfRoot 'venv-windows'\nuv sync --project $agentPerfRoot\nif ($LASTEXITCODE -ne 0) { throw 'uv sync failed with exit code ' + $LASTEXITCODE + '.' }\n","schema-2/windows/speed-bench.run":"$speedBenchRoot = Join-Path $HOME {{ROOT_NAME}}\n$speedBenchPython = Join-Path $speedBenchRoot '.venv\\Scripts\\python.exe'\n$speedBenchOutput = Join-Path (Get-Location) {{OUTPUT_NAME}}\n{{#if DISCOVER_MODEL}}\n$speedBenchApi = {{API_BASE}}\n$speedBenchModels = @((Invoke-RestMethod -Uri ($speedBenchApi + '/models')).data)\nif ($speedBenchModels.Count -ne 1 -or -not $speedBenchModels[0].id) { throw 'Expected exactly one served model; check the recipe server.' }\n$speedBenchModel = [string]$speedBenchModels[0].id\n{{/if}}\n& $speedBenchPython (Join-Path $speedBenchRoot 'speed_bench.py') `\n  --url {{API_BASE}} `\n  --model {{API_MODEL}} `\n  --bench {{PROFILE}} `\n  --category {{CATEGORY}} `\n  --osl {{OUTPUT_TOKENS}} `\n  --concurrency {{CONCURRENCY}} `\n{{#if INCLUDE_LIMIT}}\n  --limit {{LIMIT}} `\n{{/if}}\n  --timeout {{TIMEOUT}} `\n{{#if INCLUDE_EXTRA_INPUTS}}\n  --extra-inputs {{EXTRA_INPUTS}} `\n{{/if}}\n  --output $speedBenchOutput\n\nif ($LASTEXITCODE -ne 0) { throw 'SPEED-Bench failed with exit code ' + $LASTEXITCODE + '.' }\nif (-not (Test-Path -LiteralPath $speedBenchOutput)) { throw 'SPEED-Bench did not create the expected results file.' }\n$speedBenchResult = Get-Content -Raw -LiteralPath $speedBenchOutput | ConvertFrom-Json -ErrorAction Stop\nif ([int]$speedBenchResult.selected_samples -ne {{EXPECTED_SAMPLES}} -or [int]$speedBenchResult.completed_samples -ne {{EXPECTED_SAMPLES}} -or [int]$speedBenchResult.failed_samples -ne 0) { throw 'Expected {{EXPECTED_SAMPLES}} successful {{SAMPLE_UNIT}} and 0 failures; refusing to display partial metrics.' }\n$overallRows = @($speedBenchResult.summary | Where-Object { $_.category -eq 'overall' })\nif ($overallRows.Count -ne 1) { throw 'SPEED-Bench results do not contain exactly one overall summary.' }\n$overall = $overallRows[0]\nif ($null -eq $overall.avg_prompt_t_s -or $null -eq $overall.avg_pred_t_s) { throw 'SPEED-Bench overall summary is missing throughput metrics.' }\n{{#if INCLUDE_E2E}}\nif ($null -eq $overall.avg_latency) { throw 'SPEED-Bench overall summary is missing latency.' }\n{{/if}}\n[pscustomobject]@{\n  'Prefill throughput (tok/s)' = [Math]::Round([double]$overall.avg_prompt_t_s, 2)\n  'Decode throughput (tok/s)' = [Math]::Round([double]$overall.avg_pred_t_s, 2)\n{{#if INCLUDE_E2E}}\n  'E2E latency (ms)' = [Math]::Round(([double]$overall.avg_latency * 1000), 2)\n{{/if}}\n}\n","schema-2/windows/speed-bench.setup":"$speedBenchRoot = Join-Path $HOME {{ROOT_NAME}}\n$null = New-Item -ItemType Directory -Force -Path $speedBenchRoot\nInvoke-WebRequest -Uri {{SPEED_BENCH_PY_URL}} -OutFile (Join-Path $speedBenchRoot 'speed_bench.py')\nInvoke-WebRequest -Uri {{REQUIREMENTS_URL}} -OutFile (Join-Path $speedBenchRoot 'requirements.txt')\npython -m venv (Join-Path $speedBenchRoot '.venv')\n$speedBenchPython = Join-Path $speedBenchRoot '.venv\\Scripts\\python.exe'\n& $speedBenchPython -m pip install -r (Join-Path $speedBenchRoot 'requirements.txt')\n"};</script>
<script>(function(){
var root=document.getElementById('cair-root'),btn=document.getElementById('cair-theme-btn');
function g(){return root.classList.contains('dark')?'\u2600':'\u263e';}
function l(){return root.classList.contains('dark')?'Switch to light theme':'Switch to dark theme';}
if(btn){btn.textContent=g();btn.setAttribute('aria-label',l());btn.title=l();
btn.addEventListener('click',function(){var d=!root.classList.contains('dark');root.classList.toggle('dark',d);try{localStorage.setItem('cair-theme',d?'dark':'light');}catch(e){}btn.textContent=g();btn.setAttribute('aria-label',l());btn.title=l();});}
})();</script>
<script>(function(){
var hw=document.querySelector('select[data-sel="hardware"]');
if(!hw)return;
hw.addEventListener('change',function(){
  if(!hw.value)return;
  location.href='hardware/'+encodeURIComponent(hw.value)+'/index.html';
});
// Model/OS/Backend are muted placeholders here (nothing to pick until
// Hardware narrows things down) -- deliberately not the native "disabled"
// attribute, since a truly disabled select doesn't dispatch mouse events
// at all in most browsers, so a click landing exactly on it would never
// reach this listener. A mousedown anywhere else in the Finder -- a
// muted field, its label, or empty padding -- is intercepted (preventing
// that field's own native dropdown from opening) and redirected to
// opening Hardware's dropdown instead. Clicks already inside Hardware's
// own label are left alone: the browser already opens it natively there
// (the label wraps the select), so re-triggering would just double-toggle
// it.
var finder=document.querySelector('section[aria-label="Recipe Finder"]');
var hwLabel=hw.closest('label');
if(finder&&hw.showPicker){
  // Only intercept once showPicker() has actually succeeded in opening
  // Hardware's dropdown -- a browser without showPicker (older Safari/
  // Firefox) skips this listener entirely (hw.showPicker is falsy, guarded
  // above), and a call that throws falls through without calling
  // preventDefault()/focus() either, so the clicked field's own default
  // behavior still runs instead of leaving the user with a dead click that
  // looks intercepted but opened nothing.
  finder.addEventListener('mousedown',function(e){
    if(hwLabel&&hwLabel.contains(e.target))return;
    try{hw.showPicker();}catch(err){return;}
    e.preventDefault();
    hw.focus();
  });
}
})();</script>
