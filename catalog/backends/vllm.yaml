schema_version: 1
id: vllm
display_name: vLLM
protocol: openai-compatible
upstream: https://github.com/vllm-project/vllm
container_default: vllm/vllm-openai:v0.24.0-ubuntu2404
notes: |-
  Recipes are self-contained: each declares its selected image and complete
  Docker startup and model-specific launch commands. Multi-node recipes include
  every node role; source-supplied alternatives remain separate complete
  options. Use the fallback default only when the source supplies neither an
  image nor a startup command.

  Known images: [vllm/vllm-openai:v0.24.0-ubuntu2404](https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.24.0-ubuntu2404)
  (fallback default); [vllm/vllm-openai:v0.25.1-ubuntu2404](https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.25.1-ubuntu2404);
  [vllm/vllm-openai:nightly](https://hub.docker.com/r/vllm/vllm-openai/tags?name=nightly)
  (mutable); [vllm/vllm-openai:nightly-311b3513af33bc29b4acb2fde2e9313e5e9966a0](https://hub.docker.com/r/vllm/vllm-openai/tags?name=nightly-311b3513af33bc29b4acb2fde2e9313e5e9966a0);
  [vllm/vllm-openai:nightly-aa9903490c616dc6871e5acc62cec7bb1e5e9434](https://hub.docker.com/r/vllm/vllm-openai/tags?name=nightly-aa9903490c616dc6871e5acc62cec7bb1e5e9434);
  [eugr/spark-vllm:latest](https://hub.docker.com/r/eugr/spark-vllm/tags?name=latest)
  (community, ARM64-only, mutable); [eugr/spark-vllm:nightly-20260704](https://hub.docker.com/r/eugr/spark-vllm/tags?name=nightly-20260704)
  (community, ARM64-only); [eugr/spark-vllm-b12x:latest](https://hub.docker.com/r/eugr/spark-vllm-b12x/tags?name=latest)
  (community, ARM64-only, mutable, custom B12x); [nvcr.io/nvidia/vllm:26.05.post1-py3](https://catalog.ngc.nvidia.com/orgs/nvidia/-/containers/vllm/-/tags)
  (NVIDIA, AMD64 and ARM64);

  Evaluation only: host networking exposes vLLM on host interfaces. Use a
  firewall or reverse proxy, a scoped read-only HF token, and an isolated cache;
  pin tested image, model, and code revisions for production.
