schema_version: 3
title: Qwen3.8-Flash-Next · DGX Station · vLLM
model: qwen/qwen3.8-flash-next
hardware: dgx-station
platform:
  os: linux
  execution: container
backend: vllm
status: experimental
precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/Inferact/Qwen3.8-Flash-Next-NVFP4
  target_label: Inferact/Qwen3.8-Flash-Next-NVFP4
  draft: null
  draft_label: null
concurrency: null
topology:
  summary: 1× DGX Station
  gpu_count: 1
  node_count: 1
  tensor_parallel_size: 1
