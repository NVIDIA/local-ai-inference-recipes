security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:qwen38-flash-next
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=qwen38-flash-next
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:qwen38-flash-next
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    vllm serve Inferact/Qwen3.8-Flash-Next-NVFP4 \
      --host 0.0.0.0 \
      --port 8000 \
      --no-enable-flashinfer-autotune \
      --max-num-seqs 32 \
      --gpu-memory-utilization 0.95 \
      --max-num-batched-tokens 8192 \
      --enable-prefix-caching \
      --distributed-executor-backend mp \
      --compilation-config '{"mode": "none", "cudagraph_mode": "full_decode_only"}' \
      --tensor-parallel-size 1 \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_xml \
      --reasoning-parser qwen3
  port: 8000
  api_model: Inferact/Qwen3.8-Flash-Next-NVFP4
notes: null
