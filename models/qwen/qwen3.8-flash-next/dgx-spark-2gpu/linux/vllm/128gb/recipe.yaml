schema_version: 4
title: Qwen3.8-Flash-Next · 2× DGX Spark · vLLM
model: qwen/qwen3.8-flash-next
hardware: dgx-spark-2gpu
platform:
  os: linux
  execution: container
backend: vllm
# Per node (2 nodes total; see topology.gpu_count/node_count below), not
# a combined/aggregate total across both DGX Sparks.
min_vidmem_gb: 128
status: experimental

limitations:
  - The source requires the custom B12x container image.

precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  target_label: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  draft: null
  draft_label: null
spec_dec: mtp
concurrency: 16
topology:
  summary: 2× DGX Spark; one node rank per Spark; tensor parallel 2
  gpu_count: 2
  node_count: 2
  tensor_parallel_size: 2
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community, mutable, ARM64, custom B12x)
  image: eugr/spark-vllm-b12x:latest
  image_url: https://hub.docker.com/r/eugr/spark-vllm-b12x/tags?name=latest
  setup_label: Start container
  setup_target: all-nodes
  setup_instructions: Run on every node after setting `HF_TOKEN`; replace the node-specific placeholders.
  setup_command: |
    # Example two-Spark values (adjust to your network):
    #   HEAD_IP="10.100.32.1"        # head node IP on the ETH subnet
    #   ETH_IF="enp1s0f0np0"        # ConnectX baseboard ethernet (socket/control)
    #   IB_IF="rocep1s0f0,roceP2p1s0f0"   # RoCE HCA names (data plane) - use both "twins"!
    export HEAD_IP="<head-connectx-ip>"
    export ETH_IF="<connectx-interface>"
    export IB_IF="<roce-interface-1>,<roce-interface-2>"
    export MASTER_PORT=29501
    export IMAGE="eugr/spark-vllm-b12x:latest"
    export HF_CACHE_DIR="$HOME/.cache/huggingface"

    mkdir -p "$HF_CACHE_DIR" "$HOME/.cache/vllm" "$HOME/.cache/flashinfer" "$HOME/.triton" "$HOME/.cache/b12x"

    docker run --rm -it \
      --privileged \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit nofile=1048576:1048576 \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -e MN_IF_NAME="$ETH_IF" \
      -e UCX_NET_DEVICES="$ETH_IF" \
      -e NCCL_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IB_HCA="$IB_IF" \
      -e NCCL_IB_DISABLE=0 \
      -e OMPI_MCA_btl_tcp_if_include="$ETH_IF" \
      -e GLOO_SOCKET_IFNAME="$ETH_IF" \
      -e TP_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IGNORE_CPU_AFFINITY=1 \
      -e HEAD_IP="$HEAD_IP" \
      -e MASTER_PORT="$MASTER_PORT" \
      -v "$HF_CACHE_DIR:/root/.cache/huggingface" \
      -v "$HOME/.cache/vllm:/root/.cache/vllm" \
      -v "$HOME/.cache/flashinfer:/root/.cache/flashinfer" \
      -v "$HOME/.triton:/root/.triton" \
      -v $HOME/.cache/b12x:/root/.cache/b12x \
      --entrypoint /bin/bash \
      "$IMAGE"
serve:
  label: Launch head
  target: head
  instructions: null
  command: |
    export CUTE_DSL_ARCH="sm_121a"
    export SAFETENSORS_FAST_GPU="1"
    export VLLM_WORKER_MULTIPROC_METHOD="spawn"
    export VLLM_SSM_CONV_STATE_LAYOUT="DS"
    export VLLM_USE_AOT_COMPILE="1"
    export VLLM_USE_MEGA_AOT_ARTIFACT="1"
    export VLLM_USE_V2_MODEL_RUNNER="1"
    export B12X_POLICY_MODE="auto"
    export VLLM_ENABLE_ROCE_ALLREDUCE="1"
    export VLLM_ROCE_ALLREDUCE_MAX_SIZE="2MB"

    vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
      --host 0.0.0.0 \
      --port 8000 \
      --trust-remote-code \
      --tensor-parallel-size 2 \
      --pipeline-parallel-size 1 \
      --mamba-cache-mode align \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --dtype bfloat16 \
      --kv-cache-dtype fp8 \
      --quantization modelopt_mixed \
      --block-size 16 \
      --load-format b12x \
      --max-model-len 262144 \
      --max-num-seqs 16 \
      --max-num-batched-tokens 4096 \
      --speculative-config '{"method":"mtp","num_speculative_tokens":4}' \
      --gdn-decode-kernel b12x \
      --linear-backend b12x \
      --moe-backend b12x \
      --no-enable-flashinfer-autotune \
      --mm-encoder-tp-mode data \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_xml \
      --enable-auto-tool-choice \
      --compilation-config '{"pass_config":{"fuse_act_quant":true}}' \
      --gpu-memory-utilization 0.7 \
      --nnodes 2 \
      --node-rank 0 \
      --master-addr "$HEAD_IP" \
      --master-port "$MASTER_PORT"
  port: 8000
  api_model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  additional_commands:
    -
      id: worker
      label: Launch worker
      target: workers
      instructions: null
      command: |
        export CUTE_DSL_ARCH="sm_121a"
        export SAFETENSORS_FAST_GPU="1"
        export VLLM_WORKER_MULTIPROC_METHOD="spawn"
        export VLLM_SSM_CONV_STATE_LAYOUT="DS"
        export VLLM_USE_AOT_COMPILE="1"
        export VLLM_USE_MEGA_AOT_ARTIFACT="1"
        export VLLM_USE_V2_MODEL_RUNNER="1"
        export B12X_POLICY_MODE="auto"
        export VLLM_ENABLE_ROCE_ALLREDUCE="1"
        export VLLM_ROCE_ALLREDUCE_MAX_SIZE="2MB"

        vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
          --host 0.0.0.0 \
          --port 8000 \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --pipeline-parallel-size 1 \
          --mamba-cache-mode align \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --dtype bfloat16 \
          --kv-cache-dtype fp8 \
          --quantization modelopt_mixed \
          --block-size 16 \
          --load-format b12x \
          --max-model-len 262144 \
          --max-num-seqs 16 \
          --max-num-batched-tokens 4096 \
          --speculative-config '{"method":"mtp","num_speculative_tokens":4}' \
          --gdn-decode-kernel b12x \
          --linear-backend b12x \
          --moe-backend b12x \
          --no-enable-flashinfer-autotune \
          --mm-encoder-tp-mode data \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_xml \
          --enable-auto-tool-choice \
          --compilation-config '{"pass_config":{"fuse_act_quant":true}}' \
          --gpu-memory-utilization 0.7 \
          --nnodes 2 \
          --node-rank 1 \
          --master-addr "$HEAD_IP" \
          --master-port "$MASTER_PORT" \
          --headless
notes: Use the same CX7 port on every node; assign both port subinterfaces on separate subnets; cache the image and checkpoint on every node; start workers before the head. Docker runs privileged.
