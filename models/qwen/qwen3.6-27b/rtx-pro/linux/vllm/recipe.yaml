schema_version: 3
title: Qwen3.6-27B · RTX PRO 6000 · vLLM
model: qwen/qwen3.6-27b
hardware: rtx-pro
platform:
  os: linux
  execution: container
backend: vllm
status: experimental
variant: mtp
precision:
  label: NVFP4-W4A16
checkpoint:
  target: https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4
  target_label: nvidia/Qwen3.6-27B-NVFP4
  draft: null
  draft_label: null
mtp: MTP=3
concurrency: 8
topology:
  summary: 1× RTX PRO 6000
  gpu_count: 1
  node_count: 1
  tensor_parallel_size: null
