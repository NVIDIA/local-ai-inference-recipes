runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:v0.28.0
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.28.0
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:v0.28.0
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    export VLLM_HAS_FLASHINFER_CUBIN=1

    vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
      --trust-remote-code \
      --quantization modelopt_fp4 \
      --kv-cache-dtype fp8 \
      --block-size 128 \
      --moe-backend marlin \
      --attention-backend FLASHINFER \
      --attention-config '{"use_trtllm_attention":true}' \
      --gpu-memory-utilization 0.90 \
      --max-num-seqs 8 \
      --max-num-batched-tokens 8192 \
      --async-scheduling \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --skip-mm-profiling \
      --load-format fastsafetensors \
      --speculative-config '{"method":"mtp","num_speculative_tokens":4,"moe_backend":"flashinfer_cutlass"}'
  port: null
  api_model: nvidia/Qwen3.6-35B-A3B-NVFP4
