limitations:
  - The image is the public NGC vLLM 26.10.pre1 release (vLLM 0.31.0 with NVIDIA patches). It includes the SM12x NVFP4 dynamic linear backend (`nvfp4_dynamic`, vllm#54614), `unquantized_linear_backend` (vllm#59021), the cuDNN BF16 GEMM backend and its warmup (vllm#59025, vllm#59244) and the DFlash sliding-window draft block fix (vllm#60252), plus prebuilt kernel and autotune caches under `/root/.cache` (mount only `~/.cache/huggingface` as shown; mounting over all of `/root/.cache` hides them).
  - Prefix caching (on by default) depends on vllm#60252. Without it, every prefix-cache hit with the DFlash2 drafter returns corrupted text (vllm#60174), so do not run this command on an image that lacks the fix.
  - Validated with image input enabled on SPEED-Bench coding (concurrency 1, 8K output), the Artificial Analysis AgentPerf-Local default replay (168 multi-turn agentic turns, prefix caching on), a prefix-cache-hit correctness check and a single-image chat request.
  - "`--gpu-memory-utilization` is 0.60 on purpose: at 0.85 the node hung during startup autotune, and 0.70 took nodes down on some runs."
precision:
  label: NVFP4
