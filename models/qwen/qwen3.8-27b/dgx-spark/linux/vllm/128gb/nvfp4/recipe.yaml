  node_count: 1
  tensor_parallel_size: null
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (NGC)
  image: nvcr.io/nvidia/vllm:26.10.pre1-py3
  image_url: https://catalog.ngc.nvidia.com/orgs/nvidia/containers/vllm
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment. The image is public on NGC, so no registry login is needed; if `docker pull` fails with `unauthorized`, clear a stale login with `docker logout nvcr.io`.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      nvcr.io/nvidia/vllm:26.10.pre1-py3
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    vllm serve nvidia/Qwen3.8-27B-NVFP4 \
      --host 0.0.0.0 \
      --port 8000 \
      --kv-cache-dtype fp8 \
      --max-model-len 262144 \
      --max-num-seqs 8 \
      --async-scheduling \
      --enable-flashinfer-autotune \
      --gpu-memory-utilization 0.60 \
      --kernel-config '{"linear_backend":"nvfp4_dynamic","nvfp4_dynamic_max_tokens":16,"unquantized_linear_backend":"flashinfer_cudnn","linear_backend_per_quant":{"fp8_w8a8":"cutlass"}}' \
      --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}' \
      --compilation-config '{"pass_config":{"fuse_act_quant":true},"max_cudagraph_capture_size":64}' \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_xml \
      --enable-auto-tool-choice
  port: 8000
  api_model: nvidia/Qwen3.8-27B-NVFP4
notes: null