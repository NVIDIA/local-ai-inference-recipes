schema_version: 3
title: Qwen3.8-27B · 2× DGX Spark · vLLM
model: qwen/qwen3.8-27b
hardware: dgx-spark-2gpu
platform:
  os: linux
  execution: container
backend: vllm
backend_version: "0.28.0"
status: optimized
variant: dflash

validation:
  validated_at: 2026-08-31
  validated_by: Perf-Sweep
  tested_stack:
    os_version: "Ubuntu 24.04.4 LTS"
    driver: "580.159.03"
    cuda: "13.0"

limitations:
  - Temporary recipe pending an NVIDIA quantized checkpoint.
precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4
  target_label: RadixArk/Qwen3.8-27B-NVFP4
  draft: https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2
  draft_label: z-lab/Qwen3.8-27B-DFlash2
mtp: null
concurrency: 8
topology:
  summary: 2× DGX Spark; one node rank per Spark; tensor parallel 2
  gpu_count: 2
  node_count: 2
  tensor_parallel_size: 2
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:v0.28.0
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.28.0
  setup_label: Start container
  setup_target: all-nodes
  setup_instructions: Run on every node after setting `HF_TOKEN`; replace the node-specific placeholders.
  setup_command: |
    # Example two-Spark values (adjust to your network):
    #   HEAD_IP="10.100.32.1"        # head node IP on the ETH subnet
    #   ETH_IF="enp1s0f0np0"        # ConnectX baseboard ethernet (socket/control)
    #   IB_IF="rocep1s0f0,roceP2p1s0f0"   # RoCE HCA names (data plane) - use both "twins"!
    export HEAD_IP="<head-connectx-ip>"
    export ETH_IF="<connectx-interface>"
    export IB_IF="<roce-interface-1>,<roce-interface-2>"
    export MASTER_PORT=29501
    export NODE_RANK="<0-1>"
    export IMAGE="vllm/vllm-openai:v0.28.0"
    export HF_CACHE_DIR="$HOME/.cache/huggingface"

    mkdir -p "$HF_CACHE_DIR" "$HOME/.cache/vllm" "$HOME/.cache/flashinfer" "$HOME/.triton"

    docker run --rm -it \
      --privileged \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit nofile=1048576:1048576 \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -e MN_IF_NAME="$ETH_IF" \
      -e UCX_NET_DEVICES="$ETH_IF" \
      -e NCCL_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IB_HCA="$IB_IF" \
      -e NCCL_IB_DISABLE=0 \
      -e OMPI_MCA_btl_tcp_if_include="$ETH_IF" \
      -e GLOO_SOCKET_IFNAME="$ETH_IF" \
      -e TP_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IGNORE_CPU_AFFINITY=1 \
      -e VLLM_FLOAT32_MATMUL_PRECISION=high \
      -e NODE_RANK="$NODE_RANK" \
      -e HEAD_IP="$HEAD_IP" \
      -e MASTER_PORT="$MASTER_PORT" \
      -v "$HF_CACHE_DIR:/root/.cache/huggingface" \
      -v "$HOME/.cache/vllm:/root/.cache/vllm" \
      -v "$HOME/.cache/flashinfer:/root/.cache/flashinfer" \
      -v "$HOME/.triton:/root/.triton" \
      --entrypoint /bin/bash \
      "$IMAGE"
serve:
  label: Launch head
  target: head
  instructions: null
  command: |
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export VLLM_USE_V2_MODEL_RUNNER="1"

    vllm serve RadixArk/Qwen3.8-27B-NVFP4 \
      --host 0.0.0.0 \
      --port 8000 \
      --trust-remote-code \
      --kv-cache-dtype fp8 \
      --gpu-memory-utilization 0.8 \
      --max-model-len 262144 \
      --max-num-seqs 8 \
      --max-num-batched-tokens 16384 \
      --enable-chunked-prefill \
      --async-scheduling \
      --enable-prefix-caching \
      --speculative-config '{"method":"dflash","model": "z-lab/Qwen3.8-27B-DFlash2", "num_speculative_tokens":8, "draft_tensor_parallel_size": 2}' \
      --load-format safetensors \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_xml \
      --enable-auto-tool-choice \
      --tensor-parallel-size 2 \
      --nnodes 2 \
      --node-rank $NODE_RANK \
      --master-addr "$HEAD_IP" \
      --master-port "$MASTER_PORT"
  port: 8000
  api_model: RadixArk/Qwen3.8-27B-NVFP4
  additional_commands:
    -
      id: worker
      label: Launch worker
      target: workers
      instructions: null
      command: |
        export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        export VLLM_USE_V2_MODEL_RUNNER="1"

        vllm serve RadixArk/Qwen3.8-27B-NVFP4 \
          --host 0.0.0.0 \
          --port 8000 \
          --trust-remote-code \
          --kv-cache-dtype fp8 \
          --gpu-memory-utilization 0.8 \
          --max-model-len 262144 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 16384 \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prefix-caching \
          --speculative-config '{"method":"dflash","model": "z-lab/Qwen3.8-27B-DFlash2", "num_speculative_tokens":8, "draft_tensor_parallel_size": 2}' \
          --load-format safetensors \
          --reasoning-parser qwen3 \
          --tool-call-parser qwen3_xml \
          --enable-auto-tool-choice \
          --tensor-parallel-size 2 \
          --nnodes 2 \
          --node-rank $NODE_RANK \
          --master-addr "$HEAD_IP" \
          --master-port "$MASTER_PORT" \
          --headless
notes: Use the same CX7 port on every node; assign both port subinterfaces on separate subnets; cache the image and checkpoint on every node; start workers before the head. Docker runs privileged.
