schema_version: 4
title: "Qwen3.8-27B (Vision) · RTX Spark · 20GB · IQ4_XS · MTP"
model: qwen/qwen3.8-27b
hardware: rtx-spark
platform:
  os: windows
  execution: native
backend: llama-cpp
backend_version: "b11609"
backend_min_version: "b11609"
min_vidmem_gb: 20
variant: vision-mtp
spec_dec: mtp
status: optimized
validation:
  validated_at: '2026-10-14'
  validated_by: jagrits
  tested_stack:
    os_version: Windows ARM64
    driver: '617.06'
    cuda: '13.4'
prerequisites:
  - "A CUDA-enabled Windows ARM64 llama.cpp build b11609, source commit fcac19079f3f2985fe74ed845f0880e7e9a8030a, with llama-server.exe on PATH."
  - "Network access for llama-server to download and cache the named Hugging Face checkpoint and projector."
limitations: null
precision:
  label: IQ4_XS
checkpoint:
  target: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/blob/main/Qwen3.8-27B-UD-IQ4_XS.gguf
  target_label: "unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ4_XS.gguf"
  draft: null
  draft_label: null
concurrency: 1
topology: null
sampling: "Target backend sampling: OFF; speculative draft backend sampling: ON; --temp=1.0; --top-p=0.95; --top-k=20; --min-p=0.0; --presence-penalty=0.0; --repeat-penalty=1.0"
security: null
runtime: null
serve:
  label: "Launch MTP · n=3"
  target: single-node
  instructions: "Run in PowerShell with llama-server.exe on PATH. llama-server downloads and caches the named target and projector from Hugging Face. The MTP head ships inside the target GGUF, so no separate draft checkpoint is fetched."
  command: |
    llama-server.exe -hf "unsloth/Qwen3.8-27B-GGUF" `
      -hff "Qwen3.8-27B-UD-IQ4_XS.gguf" `
      --mmproj-url "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/4ca720788d1e01f1bff70c033e0d0028fd02e502/mmproj-F16.gguf" `
      --host 127.0.0.1 `
      --port 9931 `
      --batch-size 4096 `
      --ubatch-size 512 `
      --ctx-size 98304 `
      --parallel 1 `
      -ngl 999 `
      --spec-type draft-mtp `
      --spec-draft-n-max 3 `
      --spec-draft-backend-sampling `
      --cache-type-k q8_0 `
      --cache-type-v q8_0 `
      --temp 1.0 `
      --top-p 0.95 `
      --top-k 20 `
      --min-p 0.0 `
      --presence-penalty 0.0 `
      --repeat-penalty 1.0
  port: 9931
  api_model: unsloth/Qwen3.8-27B-GGUF
notes: "q8_0 K and V cache is what fits 96K context inside a 20 GB budget; every other Qwen3.8-27B recipe runs the default F16 cache. Projector: [mmproj-F16.gguf](https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/blob/4ca720788d1e01f1bff70c033e0d0028fd02e502/mmproj-F16.gguf)."
