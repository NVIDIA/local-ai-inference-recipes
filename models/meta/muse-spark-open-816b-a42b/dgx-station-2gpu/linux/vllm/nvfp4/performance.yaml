# Measured 2026-11-16 on two DGX Stations (GB300, head + worker), this recipe as written, 1 user, on vllm/vllm-openai:v0.34.0:
# the same arm64 image, pulled from vLLM's release pipeline (commit 62d4bc3c) before Docker Hub published the tag.
# Harness: the site's SPEED-Bench coding command (aiperf {custom-dataset-type speed_bench_coding}, qualitative.jsonl coding rows,
# --osl 8192, 10 x users measured, 3 x users warmup). Deviations that do not change the request stream: --url with an explicit
# port, --tokenizer pointing at the local checkpoint, --no-gpu-telemetry (the node's DCGM exporter hangs aiperf's export).
# Runtime revision is its arm64 manifest digest (Docker Hub tag index sha256:20fdb089...).
