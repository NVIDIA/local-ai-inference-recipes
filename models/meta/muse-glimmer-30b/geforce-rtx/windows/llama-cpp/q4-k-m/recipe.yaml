      --no-mmproj `
      --host 127.0.0.1 `
      --port 9931 `
      --batch-size 4096 `
      --ubatch-size 1024 `
      --ctx-size 65536 `
      --parallel 1 `
      -ngl 999 `
      --jinja `
      --chat-template-kwargs '{"preserve_thinking":true}' `
      --spec-type draft-dflash `
      --spec-draft-n-max 15 `
      --spec-draft-backend-sampling
  port: 9931
  api_model: meta-models/Muse-Glimmer-30B-GGUF
