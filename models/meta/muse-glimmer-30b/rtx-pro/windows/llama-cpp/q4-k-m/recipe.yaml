  instructions: "Run in PowerShell. llama-server downloads and caches the target and DFlash GGUF files from Hugging Face."
  command: |
    llama-server.exe -hf "meta-models/Muse-Glimmer-30B-GGUF" `
      -hff "Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf" `
      -hfrd "meta-models/Muse-Glimmer-30B-GGUF" `
      --spec-draft-model "dflash-Muse-Glimmer-30B-Q4_K_M.gguf" `
      --no-mmproj `
      --batch-size 2048 `
      --ubatch-size 1024 `
      --ctx-size 65536 `
      --parallel 1 `
      --n-predict 256 `
      -ngl 999 `
      --jinja `
      --chat-template-kwargs '{"preserve_thinking":true}' `
      --spec-type draft-dflash `
      --spec-draft-n-max 15 `
      --spec-draft-backend-sampling
  port: null
  api_model: null
notes: "The pinned [Q4_K_M target](https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/blob/70bf1b61ac09f91b24d39038091b41c582bc5d7a/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf) and [DFlash draft](https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/blob/70bf1b61ac09f91b24d39038091b41c582bc5d7a/dflash-Muse-Glimmer-30B-Q4_K_M.gguf) are the checkpoints used for selection. DFlash depth 15 and the batch settings are the Pareto-balanced RTX PRO 6000 choice."
