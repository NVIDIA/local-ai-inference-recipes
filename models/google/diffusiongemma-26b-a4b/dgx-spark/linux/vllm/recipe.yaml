security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community, mutable, ARM64)
  image: eugr/spark-vllm:latest
  image_url: https://hub.docker.com/r/eugr/spark-vllm/tags?name=latest
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      eugr/spark-vllm:latest
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    vllm serve nvidia/diffusiongemma-26B-A4B-it-NVFP4 \
      --max-model-len 262144 \
      --gpu-memory-utilization 0.8 \
      --port 8000 \
      --host 0.0.0.0 \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser gemma4 \
      --load-format fastsafetensors \
      --attention-backend TRITON_ATTN \
      --max-num-seqs 10 \
      --enable-prefix-caching \
      --diffusion-config '{"canvas_length":256}' \
      --override-generation-config '{"max_new_tokens": null}' \
      --reasoning-parser gemma4 \
      --default-chat-template-kwargs '{"enable_thinking": true}'
  port: 8000
  api_model: nvidia/diffusiongemma-26B-A4B-it-NVFP4
