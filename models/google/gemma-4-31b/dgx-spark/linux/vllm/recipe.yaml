security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community, ARM64)
  image: eugr/spark-vllm:nightly-20260704
  image_url: https://hub.docker.com/r/eugr/spark-vllm/tags?name=nightly-20260704
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      eugr/spark-vllm:nightly-20260704
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    vllm serve nvidia/Gemma-4-31B-IT-NVFP4 \
      --gpu-memory-utilization 0.80 \
      --max-model-len 262144 \
      --max-num-seqs 8 \
      --host 0.0.0.0 \
      --port 8000 \
      --enable-prefix-caching \
      --max-num-batched-tokens 8192 \
      --reasoning-parser gemma4 \
      --enable-auto-tool-choice \
      --tool-call-parser gemma4 \
      --load-format fastsafetensors \
      --speculative-config '{"model": "google/gemma-4-31B-it-assistant", "num_speculative_tokens": 4}'
  port: 8000
  api_model: nvidia/Gemma-4-31B-IT-NVFP4
