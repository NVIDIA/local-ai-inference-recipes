schema_version: 4
title: "Recursive Flint 40B-A2.5B · NVIDIA RTX PRO 6000 Blackwell · Q4_1"
model: recursivesi/flint
hardware: rtx-pro
platform:
  os: windows
  execution: native
backend: llama-cpp
backend_version: b11803
backend_min_version: b11803
min_vidmem_gb: 28
status: experimental
prerequisites:
  - "Windows x64 CUDA 13.4 llama.cpp b11803 or later, with matching CUDA runtime DLLs. b11803 downloads: https://github.com/ggml-org/llama.cpp/releases/tag/b11803."
  - "Download the linked flint-int4-q4_1.gguf into the folder containing llama-server.exe."
  - "Allow 28 GiB for inference plus operating-system headroom."
limitations: null
precision:
  label: Q4_1
checkpoint:
  target: https://huggingface.co/RecursiveSI/flint-int4-gguf/blob/main/flint-int4-q4_1.gguf
  target_label: RecursiveSI/flint-int4-gguf/flint-int4-q4_1.gguf
  draft: null
  draft_label: null
concurrency: 1
topology: null
sampling: "Backend sampling: OFF; temp 0; top-p 1; top-k 1; min-p 0; presence-penalty 0; repeat-penalty 1; seed 1234."
security: null
runtime: null
serve:
  label: Launch Recursive Flint 40B-A2.5B Q4_1
  target: single-node
  instructions: "In PowerShell, open the folder containing llama-server.exe and the GGUF, then set $env:GGML_CUDA_MMQ_PREC = \"auto\" before launching."
  command: |
    .\llama-server.exe -m flint-int4-q4_1.gguf `
      --no-mmproj `
      --host 127.0.0.1 `
      --port 49734 `
      --batch-size 2048 `
      --ubatch-size 2048 `
      --ctx-size 98304 `
      --parallel 1 `
      -ngl 999 `
      --n-predict 8192 `
      -fit off `
      --temp 0 `
      --top-p 1 `
      --top-k 1 `
      --min-p 0 `
      --presence-penalty 0 `
      --repeat-penalty 1 `
      -fa on `
      -ctk f16 `
      -ctv f16 `
      --jinja `
      --seed 1234 `
      --threads 12 `
      --threads-batch 12 `
      --metrics `
      --no-webui `
      --alias flint-q4-1
  port: 49734
  api_model: flint-q4-1
