runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:nightly
  image_url: https://hub.docker.com/layers/vllm/vllm-openai/nightly
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:nightly
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    # Install b12x==1.5.1 in the container and download the kernels
    pip install b12x==1.5.1
    vllm download-kernels

    vllm serve \
      --model nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB \
      --block-size 64 \
      --enable-auto-tool-choice \
      --enable-mamba-cache-stochastic-rounding \
      --enable-mamba-shared-prefix-checkpoint \
      --mamba-backend flashinfer \
      --mamba-cache-philox-rounds 5 \
      --mamba-ssm-cache-dtype float16 \
      --max-model-len 262144 \
      --max-num-batched-tokens 8192 \
      --max-num-seqs 8 \
      --prefix-match-unit 64 \
      --reasoning-parser nemotron_v3 \
      --speculative_config.method dflash \
      --speculative_config.model nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr \
      --speculative_config.num_speculative_tokens 7 \
      --tool-call-parser qwen3_coder \
      --trust-remote-code
  port: 8000
  api_model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
