title: NVIDIA Nemotron 3 Super 120B A12B · RTX PRO 6000 · vLLM
model: nvidia/nemotron-3-super-120b-a12b
hardware: rtx-pro
platform:
  os: linux
  execution: container
backend: vllm
min_vidmem_gb: 24
