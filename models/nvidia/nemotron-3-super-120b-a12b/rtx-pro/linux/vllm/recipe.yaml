security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:v0.24.0-ubuntu2404
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.24.0-ubuntu2404
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:v0.24.0-ubuntu2404
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    VLLM_FLOAT32_MATMUL_PRECISION="high" \
    VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 \
    vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
         --host 0.0.0.0 \
         --port 8000 \
         --max-model-len 262144 \
         --gpu-memory-utilization 0.92 \
         --max-num-seqs 8 \
         --attention-backend flashinfer \
         --max-num-batched-tokens 16384 \
         --kv-cache-dtype fp8 \
         --mamba-cache-mode align \
         --mamba_ssm_cache_dtype float32 \
         --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
         --enable-prefix-caching \
         --reasoning-parser nemotron_v3 \
         --enable-auto-tool-choice \
         --tool-call-parser qwen3_xml
  port: 8000
  api_model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
notes: null
