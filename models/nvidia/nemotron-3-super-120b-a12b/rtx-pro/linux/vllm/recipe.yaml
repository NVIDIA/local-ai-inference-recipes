  label: NVFP4
checkpoint:
  target: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
  target_label: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
  draft: null
