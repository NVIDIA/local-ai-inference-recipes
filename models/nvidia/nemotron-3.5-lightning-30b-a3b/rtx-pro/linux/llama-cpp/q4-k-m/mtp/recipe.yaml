schema_version: 3
title: "NVIDIA Nemotron 3.5 Lightning 30B A3B · NVIDIA RTX PRO 6000 Blackwell · llama.cpp · Q4_K_M"
model: nvidia/nemotron-3.5-lightning-30b-a3b
hardware: rtx-pro
platform:
  os: linux
  execution: native
backend: llama-cpp
min_vidmem_gb: 24
