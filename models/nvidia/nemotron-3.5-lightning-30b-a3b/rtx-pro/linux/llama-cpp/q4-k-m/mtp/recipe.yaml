  draft: null
  draft_label: null
mtp: "ON=3"
concurrency: 1
topology: null
sampling: "Target backend sampling: OFF; speculative draft backend sampling: ON"
security: null
runtime: null
serve:
  label: "Launch MTP · n=3"
  target: single-node
  instructions: "Run in a Linux shell. llama-server downloads and caches the integrated-MTP target GGUF from Hugging Face."
  command: |
    llama-server -hf "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF" \
      -hff "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf" \
      --no-mmproj \
      --batch-size 2048 \
      --ubatch-size 2048 \
      --ctx-size 65536 \
      --parallel 1 \
      --n-predict 256 \
      -ngl 999 \
      --jinja \
      --chat-template-kwargs '{"enable_thinking":true}' \
      --spec-type draft-mtp \
      --spec-draft-n-max 3 \
      --spec-draft-backend-sampling
  port: null
  api_model: null
notes: "The pinned [Q4_K_M target GGUF](https://huggingface.co/unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/blob/f2d3fe3694501008786e81e5f20360cbf715496a/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf) contains integrated MTP layers."
