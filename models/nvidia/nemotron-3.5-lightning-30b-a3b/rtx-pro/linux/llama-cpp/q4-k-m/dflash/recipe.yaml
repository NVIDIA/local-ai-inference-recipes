serve:
  label: "Launch DFlash · n=6"
  target: single-node
  instructions: "Run in a Linux shell. llama-server downloads and caches the target and DFlash GGUF files from Hugging Face."
  command: |
    llama-server -hf "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF" \
      -hff "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf" \
      -hfrd "apolo13x/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-DFlash-GGUF" \
      --spec-draft-model "dflash-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf" \
      --no-mmproj \
      --batch-size 2048 \
      --ubatch-size 2048 \
      --ctx-size 65536 \
      --parallel 1 \
      -ngl 999 \
      --jinja \
      --chat-template-kwargs '{"enable_thinking":true}' \
      --spec-type draft-dflash \
      --spec-draft-n-max 6 \
      --no-spec-draft-backend-sampling
  port: null
  api_model: null
