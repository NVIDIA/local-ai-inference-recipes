schema_version: 3
title: "NVIDIA Nemotron 3.5 Lightning 30B A3B · NVIDIA RTX PRO 6000 Blackwell · llama.cpp · Q4_K_M"
model: nvidia/nemotron-3.5-lightning-30b-a3b
hardware: rtx-pro
platform:
  os: linux
  execution: native
backend: llama-cpp
variant: dflash
status: experimental
prerequisites:
  - A Linux build of llama.cpp commit fe8156f789011f6ea0baf6917ea09f88b89d9554 providing llama-server.
limitations:
  - These settings are ported from the Windows selection and have not been performance-validated on Linux.
  - The source sweep used a 40,960-token server context; the launch command uses a 65,536-token context.
precision:
  label: Q4_K_M
checkpoint:
  target: https://huggingface.co/unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/blob/f2d3fe3694501008786e81e5f20360cbf715496a/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf
  target_label: unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
  draft: https://huggingface.co/apolo13x/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-DFlash-GGUF/blob/3051796f1bcf60ac44a27c2f79c52a2a2b3e2b37/dflash-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf
