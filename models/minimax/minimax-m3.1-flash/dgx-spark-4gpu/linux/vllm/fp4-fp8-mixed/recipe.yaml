schema_version: 3
title: MiniMax-M3.1-Flash · 4× DGX Spark · vLLM
model: minimax/minimax-m3.1-flash
hardware: dgx-spark-4gpu
platform:
  os: linux
  execution: container
backend: vllm
backend_version: 0.1.dev23341+g8744dd2fb.d20261022.cu134
status: experimental
min_vidmem_gb: 128
prerequisites:
  - Four 128 GB DGX Spark nodes with Docker and a configured ConnectX RoCE network.
limitations:
  - Image and video inputs and requests near the configured context limit have not been validated.
precision:
  label: FP4 + FP8 Mixed
checkpoint:
  target: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash
  target_label: MiniMaxAI/MiniMax-M3.1-Flash
  draft: null
  draft_label: null
spec_dec: dspark
concurrency: 2
topology:
  summary: 4× DGX Spark; 128 GB per node; one node rank per Spark; tensor parallel 4
  gpu_count: 4
  node_count: 4
  tensor_parallel_size: 4
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (official, mutable, ARM64)
  image: vllm/vllm-openai:minimax-m31-flash
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=minimax-m31-flash
  setup_label: Start container
  setup_target: all-nodes
  setup_instructions: Run on all four nodes. Use the same head node ConnectX address (`HEAD_IP`) and rendezvous port (`MASTER_PORT`) on every node. Set `ETH_IF` to the local ConnectX Ethernet interface for control traffic and `IB_IF` to both local RoCE host channel adapter names for data traffic.
  setup_command: |
    # Example four-Spark network values; adjust to the configured network:
    #   HEAD_IP="10.100.32.1"               # head node's ConnectX address
    #   ETH_IF="enp1s0f0np0"               # local Ethernet interface for control traffic
    #   IB_IF="rocep1s0f0,roceP2p1s0f0"    # both local RoCE adapters for data traffic
    export HEAD_IP="<head-connectx-ip>"
    export ETH_IF="<connectx-interface>"
    export IB_IF="<roce-interface-1>,<roce-interface-2>"
    export MASTER_PORT=29501
    export IMAGE="vllm/vllm-openai:minimax-m31-flash"
    export HF_CACHE_DIR="$HOME/.cache/huggingface"

    mkdir -p "$HF_CACHE_DIR" "$HOME/.cache/vllm" "$HOME/.cache/flashinfer" "$HOME/.triton"

    docker run --rm -it \
      --privileged \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit nofile=1048576:1048576 \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e MN_IF_NAME="$ETH_IF" \
      -e UCX_NET_DEVICES="$ETH_IF" \
      -e NCCL_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IB_HCA="$IB_IF" \
      -e NCCL_IB_DISABLE=0 \
      -e OMPI_MCA_btl_tcp_if_include="$ETH_IF" \
      -e GLOO_SOCKET_IFNAME="$ETH_IF" \
      -e TP_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IGNORE_CPU_AFFINITY=1 \
      -e NCCL_MAX_CTAS=8 \
      -e HEAD_IP="$HEAD_IP" \
      -e MASTER_PORT="$MASTER_PORT" \
      -v "$HF_CACHE_DIR:/root/.cache/huggingface" \
      -v "$HOME/.cache/vllm:/root/.cache/vllm" \
      -v "$HOME/.cache/flashinfer:/root/.cache/flashinfer" \
      -v "$HOME/.triton:/root/.triton" \
      --entrypoint /bin/bash \
      "$IMAGE"
serve:
  label: Launch head
  target: head
  instructions: Run inside the head container after starting all three workers.
  command: |
    vllm serve MiniMaxAI/MiniMax-M3.1-Flash \
      --gpu-memory-utilization 0.8 \
      --max-model-len 262144 \
      --max-num-seqs 2 \
      --attention-config '{"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}' \
      --kv-cache-dtype fp8 \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m3 \
      --reasoning-parser minimax_m3 \
      --tensor-parallel-size 4 \
      --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_tensor_parallel_size":4, "kv_cache_dtype":"bfloat16"}' \
      --load-format instanttensor \
      --nnodes 4 \
      --node-rank 0 \
      --master-addr "$HEAD_IP" \
      --master-port "$MASTER_PORT"
  port: null
  api_model: MiniMaxAI/MiniMax-M3.1-Flash
  additional_commands:
    - id: workers
      label: Launch workers
      target: workers
      instructions: Run inside each worker container. Set `NODE_RANK` to a unique value of 1, 2, or 3; rank 0 belongs to the head.
      command: |
        export NODE_RANK="<worker-rank>"

        vllm serve MiniMaxAI/MiniMax-M3.1-Flash \
          --gpu-memory-utilization 0.8 \
          --max-model-len 262144 \
          --max-num-seqs 2 \
          --attention-config '{"indexer_kv_dtype":"fp8","minimax_m3_msa_decode_backend":"cutlass"}' \
          --kv-cache-dtype fp8 \
          --enable-auto-tool-choice \
          --tool-call-parser minimax_m3 \
          --reasoning-parser minimax_m3 \
          --tensor-parallel-size 4 \
          --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_tensor_parallel_size":4, "kv_cache_dtype":"bfloat16"}' \
          --load-format instanttensor \
          --nnodes 4 \
          --node-rank "$NODE_RANK" \
          --master-addr "$HEAD_IP" \
          --master-port "$MASTER_PORT" \
          --headless
notes: Use the same ConnectX-7 port on every node and assign its two subinterfaces to separate subnets. Cache the image and checkpoint on every node. Start all three workers before the head. Docker runs privileged. Checkpoint quantization is MXFP8 with NVFP4 MoE weights; the checkpoint config declares `torch_dtype` as `bfloat16`.
