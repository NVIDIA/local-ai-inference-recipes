schema_version: 3
title: MiniMax-M3 · 4× DGX Spark · vLLM
model: minimax/minimax-m3
hardware: dgx-spark-4gpu
platform:
  os: linux
  execution: container
backend: vllm
status: experimental
limitations:
  - The source reports this recipe currently runs out of memory with recent builds.
precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/nvidia/MiniMax-M3-NVFP4
  target_label: nvidia/MiniMax-M3-NVFP4
  draft: https://huggingface.co/Inferact/MiniMax-M3-EAGLE3
  draft_label: Inferact/MiniMax-M3-EAGLE3
mtp: null
concurrency: 8
topology:
  summary: 4× DGX Spark; one node rank per Spark; tensor parallel 4
  gpu_count: 4
  node_count: 4
  tensor_parallel_size: 4
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community, mutable, ARM64)
  image: eugr/spark-vllm:latest
  image_url: https://hub.docker.com/r/eugr/spark-vllm/tags?name=latest
  setup_label: Start container
  setup_target: all-nodes
  setup_instructions: Run on every node after setting `HF_TOKEN`; replace the node-specific placeholders.
  setup_command: |
    export HEAD_IP="<head-connectx-ip>"
    export ETH_IF="<connectx-interface>"
    export IB_IF="<roce-interface-1>,<roce-interface-2>"
    export MASTER_PORT=29501
    export NODE_RANK="<0-3>"
    export IMAGE="eugr/spark-vllm:latest"
    export HF_CACHE_DIR="$HOME/.cache/huggingface"

    mkdir -p "$HF_CACHE_DIR" "$HOME/.cache/vllm" "$HOME/.cache/flashinfer" "$HOME/.triton"

    docker run --rm -it \
      --privileged \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit nofile=1048576:1048576 \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -e MN_IF_NAME="$ETH_IF" \
      -e UCX_NET_DEVICES="$ETH_IF" \
      -e NCCL_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IB_HCA="$IB_IF" \
      -e NCCL_IB_DISABLE=0 \
      -e OMPI_MCA_btl_tcp_if_include="$ETH_IF" \
      -e GLOO_SOCKET_IFNAME="$ETH_IF" \
      -e TP_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IGNORE_CPU_AFFINITY=1 \
      -e VLLM_FLOAT32_MATMUL_PRECISION=high \
      -e NODE_RANK="$NODE_RANK" \
      -e HEAD_IP="$HEAD_IP" \
      -e MASTER_PORT="$MASTER_PORT" \
      -v "$HF_CACHE_DIR:/root/.cache/huggingface" \
      -v "$HOME/.cache/vllm:/root/.cache/vllm" \
      -v "$HOME/.cache/flashinfer:/root/.cache/flashinfer" \
      -v "$HOME/.triton:/root/.triton" \
      --entrypoint /bin/bash \
      "$IMAGE"
serve:
  label: Launch head
  target: head
  instructions: null
  command: |
    vllm serve nvidia/MiniMax-M3-NVFP4 \
      --tensor-parallel-size 4 \
      --max-num-seqs 8 \
      --max-num-batched-tokens 8192 \
      --gpu-memory-utilization 0.87 \
      --kv-cache-dtype fp8 \
      --moe-backend flashinfer_b12x \
      --load-format instanttensor \
      --block-size 128 \
      --max-model-len 262144 \
      --attention-backend triton_attn \
      --tool-call-parser minimax_m3 \
      --reasoning-parser minimax_m3 \
      --enable-auto-tool-choice \
      --default-chat-template-kwargs '{"thinking_mode":"enabled"}' \
      --speculative-config '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}' \
      --nnodes 4 \
      --node-rank 0 \
      --master-addr "$HEAD_IP" \
      --master-port "$MASTER_PORT"
  port: null
  api_model: nvidia/MiniMax-M3-NVFP4
  additional_commands:
    -
      id: workers
      label: Launch workers
      target: workers
      instructions: null
      command: |
        vllm serve nvidia/MiniMax-M3-NVFP4 \
          --tensor-parallel-size 4 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 8192 \
          --gpu-memory-utilization 0.87 \
          --kv-cache-dtype fp8 \
          --moe-backend flashinfer_b12x \
          --load-format instanttensor \
          --block-size 128 \
          --max-model-len 262144 \
          --attention-backend triton_attn \
          --tool-call-parser minimax_m3 \
          --reasoning-parser minimax_m3 \
          --enable-auto-tool-choice \
          --default-chat-template-kwargs '{"thinking_mode":"enabled"}' \
          --speculative-config '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}' \
          --nnodes 4 \
          --node-rank "$NODE_RANK" \
          --master-addr "$HEAD_IP" \
          --master-port "$MASTER_PORT" \
          --headless
notes: Use the same CX7 port on every node; assign both port subinterfaces on separate subnets; cache the image and checkpoint on every node; start workers before the head. Docker runs privileged.
