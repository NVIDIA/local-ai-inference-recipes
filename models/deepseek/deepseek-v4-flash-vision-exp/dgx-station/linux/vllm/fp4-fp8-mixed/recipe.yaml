schema_version: 4
title: DeepSeek-V4-Flash-Vision-Exp · DGX Station · vLLM
model: deepseek/deepseek-v4-flash-vision-exp
hardware: dgx-station
platform:
  os: linux
  execution: container
backend: vllm
backend_version: null
status: experimental

precision:
  label: FP4 + FP8 Mixed
checkpoint:
  target: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  target_label: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  draft: null
  draft_label: null
concurrency: 16
topology:
  summary: Single DGX Station
  gpu_count: 1
  node_count: 1
  tensor_parallel_size: 1
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container
  image: vllm/vllm-openai:deepseekv4-flash-vision
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=deepseekv4-flash-vision
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Download the model from Hugging Face on the host machine before running the container.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:deepseekv4-flash-vision
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
      --host 0.0.0.0 \
      --port 8000 \
      --trust-remote-code \
      --tensor-parallel-size 1 \
      --kv-cache-dtype fp8_ds_mla \
      --block-size 256 \
      --max-model-len 1048576 \
      --max-num-seqs 16 \
      --max-num-batched-tokens 32768 \
      --max-cudagraph-capture-size 512 \
      --gpu-memory-utilization 0.92 \
      --enable-prefix-caching \
      --async-scheduling \
      --enable-chunked-prefill \
      --speculative-config '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","enable_adaptive_verification":true}' \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --generation-config vllm \
      --compilation-config '{"custom_ops":["all"]}'
  port: 8000
  api_model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
notes:
