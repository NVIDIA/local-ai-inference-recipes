schema_version: 4
title: DeepSeek-V4-Flash-Vision-Exp · 4× DGX Spark · vLLM
model: deepseek/deepseek-v4-flash-vision-exp
hardware: dgx-spark-4gpu
platform:
  os: linux
  execution: container
backend: vllm
backend_version: "0.1.dev21830+g8244d1c44.d20261015"
# Per node; four nodes total.
min_vidmem_gb: 64
status: optimized
validation:
  validated_at: "2026-10-23"
  validated_by: perflab
  tested_stack:
    os_version: "FastOS 1.145.45"
    driver: "580.159.03"
    cuda: "13.0.2"

prerequisites:
  - Four DGX Spark nodes with at least 64 GB of memory per node and a configured RoCE network.
  - Cache the complete checkpoint, tokenizer, and processor files on every node before launch; HF_HUB_OFFLINE=1 and TRANSFORMERS_OFFLINE=1 disable downloads.

limitations:
  - The source requires the custom B12x container image.

precision:
  label: FP4 + FP8 Mixed
checkpoint:
  target: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  target_label: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  draft: null
  draft_label: null
concurrency: 8
topology:
  summary: 4× DGX Spark; 64 GB per node; one node rank per Spark; tensor parallel 4
  gpu_count: 4
  node_count: 4
  tensor_parallel_size: 4
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community, mutable, ARM64, custom B12x)
  image: eugr/spark-vllm-b12x:latest
  image_url: https://hub.docker.com/r/eugr/spark-vllm-b12x/tags?name=latest
  setup_label: Start container
  setup_target: all-nodes
  setup_instructions: Run on every node after setting `HF_TOKEN`; replace the node-specific placeholders.
  setup_command: |
    # Example four-Spark values (adjust to your network):
    #   HEAD_IP="10.100.32.1"        # head node IP on the ETH subnet
    #   ETH_IF="enp1s0f0np0"        # ConnectX baseboard ethernet (socket/control)
    #   IB_IF="rocep1s0f0,roceP2p1s0f0"   # RoCE HCA names (data plane) - use both "twins"!
    export HEAD_IP="<head-connectx-ip>"
    export ETH_IF="<connectx-interface>"
    export IB_IF="<roce-interface-1>,<roce-interface-2>"
    export MASTER_PORT=29501
    export IMAGE="eugr/spark-vllm-b12x:latest"
    export HF_CACHE_DIR="$HOME/.cache/huggingface"

    mkdir -p "$HF_CACHE_DIR" "$HOME/.cache/vllm" "$HOME/.cache/flashinfer" "$HOME/.triton" "$HOME/.cache/b12x"

    docker run --rm -it \
      --privileged \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit nofile=1048576:1048576 \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -e MN_IF_NAME="$ETH_IF" \
      -e UCX_NET_DEVICES="$ETH_IF" \
      -e NCCL_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IB_HCA="$IB_IF" \
      -e NCCL_IB_DISABLE=0 \
      -e OMPI_MCA_btl_tcp_if_include="$ETH_IF" \
      -e GLOO_SOCKET_IFNAME="$ETH_IF" \
      -e TP_SOCKET_IFNAME="$ETH_IF" \
      -e NCCL_IGNORE_CPU_AFFINITY=1 \
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
      -e NCCL_BUFFSIZE=1048576 \
      -e NCCL_MAX_CTAS=8 \
      -e VLLM_ENABLE_ROCE_ALLREDUCE=1 \
      -e VLLM_ROCE_ALLREDUCE_MAX_SIZE=2MB \
      -e MIMALLOC_PURGE_DELAY=0 \
      -e B12X_COMPILE_WORKERS=1 \
      -e VLLM_USE_RUST_FRONTEND=0 \
      -e HF_HUB_OFFLINE=1 \
      -e TRANSFORMERS_OFFLINE=1 \
      -e MAX_JOBS=1 \
      -e CMAKE_BUILD_PARALLEL_LEVEL=1 \
      -e NINJAFLAGS=-j1 \
      -e MAKEFLAGS=-j1 \
      -e HEAD_IP="$HEAD_IP" \
      -e MASTER_PORT="$MASTER_PORT" \
      -v "$HF_CACHE_DIR:/root/.cache/huggingface" \
      -v "$HOME/.cache/vllm:/root/.cache/vllm" \
      -v "$HOME/.cache/flashinfer:/root/.cache/flashinfer" \
      -v "$HOME/.triton:/root/.triton" \
      -v $HOME/.cache/b12x:/root/.cache/b12x \
      --entrypoint /bin/bash \
      "$IMAGE"
serve:
  label: Launch head
  target: head
  instructions: Run inside the head container after starting all three workers.
  command: |
    export CUTE_DSL_ARCH="sm_121a"
    export VLLM_USE_AOT_COMPILE="1"
    export VLLM_USE_BREAKABLE_CUDAGRAPH="0"
    export VLLM_USE_MEGA_AOT_ARTIFACT="1"
    export VLLM_MEMORY_PROFILE_INCLUDE_ATTN="1"
    export VLLM_USE_FLASHINFER_SAMPLER="1"
    export VLLM_USE_B12X_WO_PROJECTION="1"
    export VLLM_USE_B12X_MHC="1"
    export VLLM_USE_B12X_FP8_GEMM="1"
    export VLLM_USE_B12X_MOE="1"
    export VLLM_USE_B12X_SPARSE_INDEXER="1"
    export VLLM_USE_V2_MODEL_RUNNER="1"
    export VLLM_MOE_SKIP_PADDING="0"
    export B12X_MLA_SM120_UNIFIED="1"
    export B12X_MOE_FORCE_A8="1"

    vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
      --host 0.0.0.0 \
      --port 8000 \
      --trust-remote-code \
      --tensor-parallel-size 4 \
      --kv-cache-dtype fp8 \
      --block-size 256 \
      --max-model-len 262144 \
      --max-num-seqs 8 \
      --max-num-batched-tokens 2048 \
      --gpu-memory-utilization 0.7 \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format b12x \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X \
      --max-cudagraph-capture-size 48 \
      --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X","draft_tensor_parallel_size":4}' \
      --kv-cache-memory-bytes 3G \
      --limit-mm-per-prompt '{"image":2}' \
      --mm-processor-cache-gb 0 \
      --mm-encoder-tp-mode weights \
      --nnodes 4 \
      --node-rank 0 \
      --master-addr "$HEAD_IP" \
      --master-port "$MASTER_PORT"
  port: 8000
  api_model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  additional_commands:
    -
      id: workers
      label: Launch workers
      target: workers
      instructions: Run inside each worker container with a unique NODE_RANK of 1, 2, or 3. Trailing flags preserve the source runner's overrides; the last value of each repeated flag takes effect.
      command: |
        # Use a different rank (1, 2, or 3) on each worker.
        export NODE_RANK="<worker-rank>"

        export CUTE_DSL_ARCH="sm_121a"
        export VLLM_USE_AOT_COMPILE="1"
        export VLLM_USE_BREAKABLE_CUDAGRAPH="0"
        export VLLM_USE_MEGA_AOT_ARTIFACT="1"
        export VLLM_MEMORY_PROFILE_INCLUDE_ATTN="1"
        export VLLM_USE_FLASHINFER_SAMPLER="1"
        export VLLM_USE_B12X_WO_PROJECTION="1"
        export VLLM_USE_B12X_MHC="1"
        export VLLM_USE_B12X_FP8_GEMM="1"
        export VLLM_USE_B12X_MOE="1"
        export VLLM_USE_B12X_SPARSE_INDEXER="1"
        export VLLM_USE_V2_MODEL_RUNNER="1"
        export VLLM_MOE_SKIP_PADDING="0"
        export B12X_MLA_SM120_UNIFIED="1"
        export B12X_MOE_FORCE_A8="1"

        vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
          --host 0.0.0.0 \
          --port 8000 \
          --trust-remote-code \
          --tensor-parallel-size 4 \
          --kv-cache-dtype fp8 \
          --block-size 256 \
          --max-model-len 262144 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 2048 \
          --gpu-memory-utilization 0.7 \
          --enable-prefix-caching \
          --tokenizer-mode deepseek_v4 \
          --tool-call-parser deepseek_v4 \
          --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
          --default-chat-template-kwargs.thinking=true \
          --default-chat-template-kwargs.reasoning_effort=high \
          --load-format b12x \
          --moe-backend b12x \
          --linear-backend b12x \
          --attention-backend B12X \
          --max-cudagraph-capture-size 48 \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
          --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X","draft_tensor_parallel_size":4}' \
          --kv-cache-memory-bytes 3G \
          --limit-mm-per-prompt '{"image":2}' \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode weights \
          --nnodes 4 \
          --node-rank "$NODE_RANK" \
          --master-addr "$HEAD_IP" \
          --master-port "$MASTER_PORT" \
          --headless
notes: Use the same CX7 port on every node; assign both port subinterfaces on separate subnets; cache the image and checkpoint on every node; start all three workers before the head. Docker runs privileged.
