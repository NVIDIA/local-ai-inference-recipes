    # Node smc521ge-0038 was NOT exclusive (other jobs on its other 4 GPUs); the 4 GPUs used were all on NUMA node 0.
    # Exact recipe serve command (with --moe-backend auto, the default). 3 repetitions of 16 requests with 1 warmup
    # request each; results are the mean of the 3 per-run averages.
    # Per run, output_token_throughput_per_user.avg: 213.46, 211.12, 205.38 (sd 4.16);
    # prefill_throughput_per_user.avg: 3771.1, 5524.8, 5972.2 (sd 1163; the first run came right after server start);
    # TTFT avg 68.7, 47.8, 46.0 ms. DSpark mean acceptance length 2.46 over the whole run.
    workload:
      input_tokens: null
      dataset: nvidia/SPEED-Bench
      profile: qualitative
      # Every qualitative category in one file (coding, humanities, math, multilingual, qa, rag, reasoning, roleplay, stem, ...).
