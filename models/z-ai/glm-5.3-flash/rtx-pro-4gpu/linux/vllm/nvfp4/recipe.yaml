schema_version: 4
title: GLM-5.3-Flash · 4× RTX PRO 6000 · vLLM
model: z-ai/glm-5.3-flash
hardware: rtx-pro-4gpu
platform:
  os: linux
  execution: container
backend: vllm
status: experimental
min_vidmem_gb: 96
precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/local-inference-lab/GLM-5.3-Flash-NVFP4
  target_label: local-inference-lab/GLM-5.3-Flash-NVFP4
  draft: https://huggingface.co/local-inference-lab/GLM-5.3-Flash-DFlash2
  draft_label: local-inference-lab/GLM-5.3-Flash-DFlash2
concurrency: 32
topology:
  summary: 4× RTX PRO 6000; tensor parallel 4
  gpu_count: 4
  node_count: 1
  tensor_parallel_size: 4
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Container (community)
  image: ghcr.io/local-inference-lab/vllm:karmic-kraken-beta
  image_url: https://github.com/local-inference-lab/blackwell-llm-docker/pkgs/container/vllm
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set HF_TOKEN in the host environment
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      ghcr.io/local-inference-lab/vllm:karmic-kraken-beta
serve:
  label: Launch
  target: single-node
  instructions: null
  command: |
    export NVIDIA_VISIBLE_DEVICES=0,1,2,3
    export CUDA_DEVICE_ORDER=PCI_BUS_ID
    export CUDA_MODULE_LOADING=LAZY
    export CUDA_BINARY_LOADER_THREAD_COUNT=8
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export TORCH_ALLOW_TF32_CUBLAS_OVERRIDE=1
    export TORCH_NCCL_USE_COMM_NONBLOCKING=0
    export TORCHINDUCTOR_LOOP_ORDERING_AFTER_FUSION=0
    export TORCH_CUDA_ARCH_LIST=12.0a
    export OMP_NUM_THREADS=1
    export SAFETENSORS_FAST_GPU=1
    export INSTANTTENSOR_BACKEND=BUFFERED
    export NCCL_BUFFSIZE=2097152
    export NCCL_IB_DISABLE=1
    export NCCL_MAX_NCHANNELS=16
    export NCCL_MIN_NCHANNELS=16
    export NCCL_NET_PLUGIN=spcx
    export NCCL_P2P_LEVEL=SYS
    export NCCL_PROTO=LL,LL128,Simple
    export B12X_DYNAMIC_DIRECT_EXPERT_SCALES=1
    export B12X_DYNAMIC_SKIP_SPLIT_BARRIER_RESET=1
    export B12X_DYNAMIC_SPLIT_COMPUTE_MAC=224
    export B12X_DYNAMIC_SPLIT_FAST_PREPARE=1
    export B12X_DYNAMIC_SPLIT_LOW_SMEM=1
    export B12X_DYNAMIC_SPLIT_ROUTE_COMPUTE=1
    export B12X_DYNAMIC_WORK_SOURCE=persistent_grid
    export B12X_MHC_PDL=1
    export B12X_PCIE_ONESHOT_BLOCK_LIMIT=4
    export B12X_PCIE_ONESHOT_PDL=1
    export B12X_PCIE_ONESHOT_THREADS=512
    export VLLM_B12X_MLA_CKV_GATHER=0
    export VLLM_B12X_MOE_FP4_FORCE_A16=0
    export VLLM_CAUSAL_CONV1D_UPDATE_HOIST=1
    export VLLM_DISABLED_KERNELS=MarlinFP8ScaledMMLinearKernel
    export VLLM_DISABLE_SHARED_EXPERTS_STREAM=0
    export VLLM_ENABLE_PCIE_ALLREDUCE=1
    export VLLM_GLM53_DFLASH_ATTN=1
    export VLLM_GLM53_KDA_GATE_SIDE_STREAM=1
    export VLLM_GLM53_L2_PREFETCH=1
    export VLLM_GLM53_L2_PREFETCH_PERSIST_MB=0
    export VLLM_GLM53_MTP_DRAFT_HEAD=nvfp4
    export VLLM_GLM53_ONLINE_DENSE_MXFP8=0
    export VLLM_GLM53_SPLIT_MAMBA_BLOCK_SIZE=auto
    export VLLM_GLM53_SPLIT_TARGET_BLOCK_SIZE=2048
    export VLLM_LM_HEAD_A16=1
    export VLLM_MTP_NVFP4_LM_HEAD=0
    export VLLM_MXFP8_LM_HEAD=0
    export VLLM_PCIE_ALLREDUCE_BACKEND=b12x
    export VLLM_PCIE_DMA_MIN_BYTES=6MB
    export VLLM_PCIE_TWOSHOT_ALLREDUCE_MAX_SIZE=off
    export VLLM_PLUGINS=
    export VLLM_USE_FASTOKENS=1
    export VLLM_USE_FLASHINFER_SAMPLER=1
    export VLLM_USE_V2_MODEL_RUNNER=1
    export VLLM_WORKER_MULTIPROC_METHOD=spawn
    vllm serve \
    local-inference-lab/GLM-5.3-Flash-NVFP4 \
    --additional-config '{"glm53_kda_decode_backend":"auto","kda_prefill_backend":"b12x"}' \
    --attention-backend B12X \
    --block-size 256 \
    --chat-template /opt/lil/runtime/templates/glm53-flash.jinja \
    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE"}' \
    --cp-kv-cache-interleave-size 4 \
    --cudagraph-capture-sizes 1 2 4 8 16 32 40 48 64 96 128 192 256 \
    --dcp-kv-cache-interleave-size 4 \
    --decode-context-parallel-size 1 \
    --default-chat-template-kwargs '{"reasoning_effort":"high","clear_thinking":false}' \
    --dtype bfloat16 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --no-enable-flashinfer-autotune \
    --enable-prefix-caching \
    --enable-prompt-tokens-details \
    --gpu-memory-utilization 0.93 \
    --host 0.0.0.0 \
    --kv-cache-dtype fp8 \
    --linear-backend b12x \
    --load-format instanttensor \
    --mamba-cache-mode align \
    --max-cudagraph-capture-size 256 \
    --max-model-len 1048576 \
    --max-num-batched-tokens 4096 \
    --max-num-seqs 32 \
    --max-parallel-prefills 1 \
    --moe-backend b12x \
    --override-generation-config '{"temperature":1.0,"top_p":0.95}' \
    --pipeline-parallel-size 1 \
    --port 8000 \
    --prefill-compute-share 0.4 \
    --prefill-schedule-interval 1 \
    --quantization modelopt_mixed \
    --reasoning-parser glm45 \
    --recurrent-checkpoint-policy request_boundaries \
    --speculative-config '{"method":"dflash", "model": "local-inference-lab/GLM-5.3-Flash-DFlash2", "draft_sample_method":"probabilistic", "rejection_sample_method":"standard","attention_backend":"FLASH_ATTN","kv_cache_dtype":"auto","num_speculative_tokens":7}' \
    --tensor-parallel-size 4 \
    --tool-call-parser glm47
  port: 8000
  api_model: local-inference-lab/GLM-5.3-Flash-NVFP4
notes: null
