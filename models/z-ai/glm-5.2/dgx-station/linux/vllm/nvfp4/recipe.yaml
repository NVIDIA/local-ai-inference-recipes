schema_version: 3
title: GLM-5.2 · DGX Station · vLLM
model: z-ai/glm-5.2
hardware: dgx-station
platform:
  os: linux
  execution: container
backend: vllm
status: experimental
variant: mtp
precision:
  label: NVFP4
checkpoint:
  target: https://huggingface.co/nvidia/GLM-5.2-NVFP4
  target_label: nvidia/GLM-5.2-NVFP4
  draft: null
  draft_label: null
mtp: MTP=4
concurrency: 8
topology:
  summary: 1× DGX Station; tensor parallel 1
  gpu_count: 1
  node_count: 1
  tensor_parallel_size: 1
sampling: null
security: Evaluation configuration only. Host networking exposes vLLM on host interfaces; use a firewall or reverse proxy, a scoped read-only HF token, and an isolated cache. For production, pin tested image, model, and code revisions.
runtime:
  kind: container
  label: Option 1 container
  image: vllm/vllm-openai:v0.25.1-ubuntu2404
  image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.25.1-ubuntu2404
  setup_label: Start container
  setup_target: single-node
  setup_instructions: Set `HF_TOKEN` in the host environment.
  setup_command: |
    docker run --rm -it \
      --gpus all \
      --ipc host \
      --network host \
      --shm-size=16g \
      --ulimit memlock=-1 \
      --ulimit stack=67108864 \
      -e HF_TOKEN=$HF_TOKEN \
      -v ~/.cache/huggingface:/root/.cache/huggingface \
      --entrypoint /bin/bash \
      vllm/vllm-openai:v0.25.1-ubuntu2404
serve:
  label: Launch option 1
  target: single-node
  instructions: null
  command: |
    export CUDA_DEVICE_ORDER=PCI_BUS_ID
    export CUDA_VISIBLE_DEVICES=1
    export VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY=1

    vllm serve nvidia/GLM-5.2-NVFP4 \
      --tensor-parallel-size 1 \
      --trust-remote-code \
      --gpu-memory-utilization 0.97 \
      --kv-cache-dtype fp8_e4m3 \
      --max-model-len 262144 \
      --max-num-seqs 8 \
      --offload-backend uva \
      --cpu-offload-gb 222 \
      --cpu-offload-params w13_weight w2_weight \
      --speculative-config '{"method":"mtp","num_speculative_tokens":4}' \
      --reasoning-parser glm45 \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --host 0.0.0.0 \
      --port 8000 \
      --load-format fastsafetensors
  port: 8000
  api_model: nvidia/GLM-5.2-NVFP4
notes: The source provides two launch alternatives using the same vLLM image.
launch:
  id: option-1
  label: Option 1 · default MoE backend
  alternatives:
    -
      id: option-2
      label: Option 2 · flashinfer_cutedsl MoE backend
      runtime:
        kind: container
        label: Option 2 container
        image: vllm/vllm-openai:v0.25.1-ubuntu2404
        image_url: https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.25.1-ubuntu2404
        setup_label: Start container
        setup_target: single-node
        setup_instructions: Set `HF_TOKEN` in the host environment.
        setup_command: |
          docker run --rm -it \
            --gpus all \
            --ipc host \
            --network host \
            --shm-size=16g \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -e HF_TOKEN=$HF_TOKEN \
            -v ~/.cache/huggingface:/root/.cache/huggingface \
            --entrypoint /bin/bash \
            vllm/vllm-openai:v0.25.1-ubuntu2404
      serve:
        label: Launch option 2
        target: single-node
        instructions: null
        command: |
          export CUDA_DEVICE_ORDER=PCI_BUS_ID
          export CUDA_VISIBLE_DEVICES=1
          export VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY=1

          vllm serve nvidia/GLM-5.2-NVFP4 \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --gpu-memory-utilization 0.97 \
            --kv-cache-dtype fp8_e4m3 \
            --max-model-len 262144 \
            --max-num-seqs 8 \
            --offload-backend uva \
            --cpu-offload-gb 222 \
            --cpu-offload-params w13_weight w2_weight \
            --speculative-config '{"method":"mtp","num_speculative_tokens":4, "moe_backend":"flashinfer_trtllm"}' \
            --reasoning-parser glm45 \
            --tool-call-parser glm47 \
            --enable-auto-tool-choice \
            --host 0.0.0.0 \
            --port 8000 \
            --load-format fastsafetensors \
            --moe-backend flashinfer_cutedsl
        port: 8000
        api_model: nvidia/GLM-5.2-NVFP4
