schema_version: 1
id: <builder>/<model>            # must match models/<builder>/<model>
display_name: <Display Name>
builder: <builder>
family: <Family>
summary: <one short neutral sentence>
# upstream: https://huggingface.co/<org>/<model>   # omit rather than guess
modalities:
  - text
availability: available          # available | pending | deprecated

